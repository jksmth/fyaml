entities:
  item1:
    # Entity that uses the composed anchor
    # This will test that the composed anchor is correctly expanded with the base anchor's content
    entity:
      id: example1
      config: *item_template
      attributes:
        name: sample name
shared:
  templates:
    base:
      # Base anchor with common properties
      base_template: &base_template
        timeout: 600
        retries: 3
        enabled: true
        metadata:
          version: 1.0
    item-template:
      # Composed anchor that references the base anchor
      # This tests that alias expansion works correctly when anchors reference other anchors
      template: &item_template
        !!merge <<: *base_template
        name: Item Template
        description: Template for items with base properties
        attributes:
          category: standard
