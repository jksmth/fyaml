# Anchor definitions - processed first to ensure anchors appear before aliases
# base_template must be defined before item_template since item_template references it
base_template: &base_template
  timeout: 600
  retries: 3
  enabled: true
  metadata:
    version: 1.0
item_template: &item_template
  <<: *base_template
  name: Item Template
  description: Template for items with base properties
  attributes:
    category: standard
